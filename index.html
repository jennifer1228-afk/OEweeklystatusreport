<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>前山美語週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style id="app-style">
:root{
  --paper:#F5F3EE; --sheet:#FFFFFF; --ink:#1F2433; --muted:#667085; --line:rgba(27,42,74,.13);
  --accent:#1B2A4A; --on-accent:#F6EFE0; --sand:#E8C27A; --sand-ink:#8A6424; --green:#2F7F55; --rose:#A94F5B;
  --ok-bg:rgba(47,127,85,.10); --warn-bg:rgba(201,114,125,.12); --soft:rgba(232,194,122,.16);
  --f-display:'Fraunces',Georgia,'Noto Sans TC','PingFang TC',serif;
  --f-body:'Public Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1626; --sheet:#172136; --ink:#ECE7DA; --muted:#9AA6BC; --line:rgba(232,194,122,.16);
  --accent:#E8C27A; --on-accent:#1B2A4A; --sand-ink:#E8C27A; --green:#72C79A; --rose:#E3949E;
  --ok-bg:rgba(114,199,154,.12); --warn-bg:rgba(227,148,158,.13); --soft:rgba(232,194,122,.10); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1626; --sheet:#172136; --ink:#ECE7DA; --muted:#9AA6BC; --line:rgba(232,194,122,.16);
  --accent:#E8C27A; --on-accent:#1B2A4A; --sand-ink:#E8C27A; --green:#72C79A; --rose:#E3949E;
  --ok-bg:rgba(114,199,154,.12); --warn-bg:rgba(227,148,158,.13); --soft:rgba(232,194,122,.10); color-scheme:dark;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:0 64px}
img{max-width:100%}
.wrap{max-width:820px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:34px;height:auto;border-radius:6px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--green)}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

/* pickers */
.pick{display:flex;gap:12px;flex-wrap:wrap;margin-block:4px 18px}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
select,input[type=text],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.55}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* report sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 44px -32px rgba(27,42,74,.45)}
.sheet-head{background:var(--accent);color:var(--on-accent);padding:26px 28px 22px;display:grid;gap:14px}
.sheet-head .org{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
.sheet-head .org img{width:30px;border-radius:6px;background:#fff}
.sheet-head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,6vw,42px);line-height:1.1;margin:0;text-wrap:balance}
.sheet-head .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.meta span{white-space:nowrap}
.sec{padding:22px 28px;border-top:1px solid var(--line);display:grid;gap:10px}
.sec:first-of-type{border-top:0}
.sec h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 small{font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--sand-ink);letter-spacing:.01em}
.sec h2 .count{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.lines{margin:0;padding-left:1.2em;display:grid;gap:4px}
.pattern{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pattern li{background:var(--soft);border-radius:10px;padding:8px 12px;font-family:var(--f-display);font-size:16.5px}
.hw{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.hw li{display:flex;gap:10px;align-items:flex-start}
.hw li::before{content:"";flex:none;width:15px;height:15px;margin-top:4px;border:1.6px solid var(--muted);border-radius:4px}
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.vocab div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.vocab .en{font-weight:600}
.vocab .zh{color:var(--rose);text-align:right}
.note{white-space:pre-wrap;margin:0}
.practice{justify-self:start;font-size:13.5px;font-weight:600;color:var(--green);text-decoration:none}
.practice:hover{text-decoration:underline}
.sheet-foot{padding:14px 28px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* teacher */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;gap:16px}
.missing{display:grid;gap:10px}
.missing-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.missing-head b{font-size:15px}
.missing-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--warn-bg);color:var(--rose);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--green)}
.chip:hover{border-color:currentColor}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tip{font-size:12.5px;color:var(--sand-ink);margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.msg{border-radius:10px;padding:10px 14px;font-size:14px}
.msg.err{background:var(--warn-bg);color:var(--rose)}
.msg.ok{background:var(--ok-bg);color:var(--green)}
.msg.info{background:var(--soft);color:var(--ink)}
.status-table{width:100%;border-collapse:collapse;font-size:14px}
.status-wrap{overflow-x:auto}
.status-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.status-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.status-table td.t{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--green)}
.pill.no{background:var(--warn-bg);color:var(--rose)}
.link-btn{border:0;background:none;color:var(--green);font-weight:600;font-size:13px;padding:2px 4px}
.group-row td{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.teacher-entry{text-align:center;margin-top:28px}
.teacher-entry button{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}

/* multi-teacher parts */
.part{padding:22px 28px;border-top:1px solid var(--line);display:grid;gap:18px}
.sheet-head+.part{border-top:0}
.part-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--sand)}
.part-head .subj{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2}
.part-head .who{font-size:14px;color:var(--muted)}
.part.waiting{gap:6px;padding-block:16px}
.part.waiting .part-head{border-bottom-color:var(--line)}
.part.waiting .subj{font-size:17px;color:var(--muted)}
.blk{display:grid;gap:8px}
.blk h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk h3 small{font-family:var(--f-display);font-weight:500;font-size:13.5px;color:var(--sand-ink)}
.blk h3 .count{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--sand-ink);white-space:nowrap}
.sheet-links{padding:14px 28px;border-top:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tlist{display:grid;gap:12px}
.tline{display:grid;gap:6px}
.tline>b{font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.tline>b span{font-size:12px;font-weight:600;color:var(--rose)}
details.more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
details.more[open] summary{margin-bottom:12px}
.tabs.seg button{padding:5px 12px;font-size:13px}
.roster input{padding:7px 10px;min-width:90px}
.link-btn.danger{color:var(--rose)}
.status-table .t{color:var(--muted);font-variant-numeric:tabular-nums}
/* overview matrix */
.legend{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.dot.ok{background:var(--ok-bg);border:1.5px solid var(--green)}
.dot.no{background:var(--warn-bg);border:1.5px solid var(--rose)}
.matrix-wrap{overflow-x:auto;margin-inline:-4px}
.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.matrix th,.matrix td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.matrix thead th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em;white-space:nowrap}
.matrix th.cls{position:sticky;left:0;background:var(--sheet);z-index:1;min-width:92px;white-space:nowrap}
.matrix tbody th.cls{display:flex;flex-direction:column;gap:0}
.matrix th.cls span{font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.matrix td{min-width:104px}
.cls-btn{border:0;background:none;padding:0;font-weight:700;font-size:14px;text-align:left;color:var(--ink)}
.cls-btn:hover{color:var(--green);text-decoration:underline}
.cell{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1.5px solid transparent;border-radius:9px;padding:4px 8px;margin-bottom:4px;text-align:left;line-height:1.3}
.cell b{font-size:13px}
.cell small{font-size:11.5px;opacity:.8}
.cell.ok{background:var(--ok-bg);color:var(--green)}
.cell.no{background:var(--warn-bg);color:var(--rose)}
.cell.dim{opacity:.35}
.cell.sel,.cell:hover{border-color:currentColor}
.matrix .group-row td{position:sticky;left:0}
.detail{border-color:var(--sand)}
.detail-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.detail-head b{font-family:var(--f-display);font-size:20px;font-weight:600}
.detail-state{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail-body{display:grid;gap:16px}

.bar .tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.bar .tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:none}
@media (max-width:560px){.bar .tabs{width:100%}}

/* pronunciation practice */
.say-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--green);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700}
.say-btn:hover{border-color:var(--green)}
.blk h3 .count+.say-btn{margin-left:4px}
.vocab .vw{cursor:pointer;border-radius:6px;transition:background .15s}
.vocab .vw:hover,.vocab .vw.saying{background:var(--soft)}
.sheet-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sheet-links .btn{display:inline-flex;align-items:center;gap:8px}
.pr-backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,22,38,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.pr-backdrop{align-items:center}}
.pr-card{background:var(--sheet);color:var(--ink);border-radius:20px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:20px 22px;display:grid;gap:12px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.pr-title{font-weight:700;font-size:14px;color:var(--muted)}
.pr-progress{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pr-en{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,8vw,42px);line-height:1.15;word-break:break-word}
.pr-zh{font-size:19px;color:var(--rose);min-height:1.4em}
.pr-controls{display:flex;justify-content:center;align-items:center;gap:16px}
.pr-round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);font-size:26px;line-height:1;color:var(--ink)}
.pr-speak{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.pr-speak.on{box-shadow:0 0 0 6px var(--soft)}
.pr-rate{display:flex;justify-content:center;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.pr-rate input{width:140px}
.pr-list{display:grid;border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto;text-align:left}
.pr-row{display:flex;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;font-size:14px}
.pr-row:last-child{border-bottom:0}
.pr-row .en{font-weight:600}
.pr-row .zh{color:var(--rose)}
.pr-row.cur{background:var(--soft)}

/* login */
.login-wrap{display:flex;justify-content:center;padding-block:24px 8px}
.login-card{max-width:440px;width:100%;gap:12px}
.login-card h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px}
.login-row{display:flex;gap:10px}
.login-row input{flex:1;font-size:17px;letter-spacing:.04em;min-width:0}
.who-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .sheet-head,.sec,.sheet-foot,.part,.sheet-links{padding-inline:18px}
  .vocab{grid-template-columns:1fr}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

var TE=new TextEncoder(),TD=new TextDecoder();
var AUTH={mode:null,sid:'',slugs:null,keys:{},err:''};
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64e(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
async function sha256hex(t){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode(t)));return Array.prototype.map.call(h,function(b){return (b<16?'0':'')+b.toString(16);}).join('');}
async function kdf(pw,salt){var base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:(S.enc&&S.enc.iter)||100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function openBox(key,box){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(box.i)},key,b64d(box.c));return JSON.parse(TD.decode(pt));}
async function sealBox(raw,obj){var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,TE.encode(JSON.stringify(obj)));return {i:b64e(iv),c:b64e(ct)};}
async function loadClasses(keys){
  var slugs=Object.keys(keys);
  for(var i=0;i<slugs.length;i++){var s=slugs[i];AUTH.keys[s]=b64d(keys[s]);var box=S.enc.classes[s];if(!box)continue;
    var k=await crypto.subtle.importKey('raw',AUTH.keys[s],'AES-GCM',false,['decrypt']);var d=await openBox(k,box);
    Object.keys(d.reports||{}).forEach(function(rk){S.reports[rk]=d.reports[rk];});}
  normalizeReports();
}
async function unlockParent(sid){
  sid=String(sid||'').replace(/\s/g,'');
  if(!/^\d{5,10}$/.test(sid)||!S.enc)return false;
  var e=S.enc.students[(await sha256hex('oe26|'+sid)).slice(0,20)];if(!e)return false;
  var obj;try{obj=await openBox(await kdf(sid,b64d(e.s)),e);}catch(x){return false;}
  S.reports={};AUTH.keys={};await loadClasses(obj.keys);
  AUTH.mode='parent';AUTH.sid=sid;AUTH.slugs=obj.slugs;AUTH.err='';
  if(AUTH.slugs.indexOf(ui.cls)<0)ui.cls=AUTH.slugs[0]||'';ui.week='';return true;
}
async function unlockTeacher(code){
  code=String(code||'').replace(/\s/g,'');
  if(!S.enc||!S.enc.teacher||!code)return false;
  var obj;try{obj=await openBox(await kdf(code,b64d(S.enc.teacher.s)),S.enc.teacher);}catch(x){return false;}
  S.reports={};AUTH.keys={};await loadClasses(obj.keys);
  AUTH.mode='tview';AUTH.sid='';AUTH.slugs=CLASSES.map(function(c){return c.slug||c[2];}).filter(function(x){return obj.keys[x];});AUTH.err='';
  if(AUTH.slugs.indexOf(ui.cls)<0)ui.cls=AUTH.slugs[0]||'';ui.week='';return true;
}
async function unlockStaff(pw){

}

async function encState(next){

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function hubLabel(wk){var m=parseIso(wk),f=addDays(m,4);return pad(m.getMonth()+1)+pad(m.getDate())+'-'+pad(f.getMonth()+1)+pad(f.getDate());}
function shortLabel(wk){var m=parseIso(wk),f=addDays(m,4);return pad(m.getMonth()+1)+'/'+pad(m.getDate())+' – '+pad(f.getMonth()+1)+'/'+pad(f.getDate());}
function longLabel(wk){var m=parseIso(wk),f=addDays(m,4);return m.getFullYear()+' · '+(m.getMonth()+1)+'/'+m.getDate()+'（一）– '+(f.getMonth()+1)+'/'+f.getDate()+'（五）';}
function stamp(isoStr){if(!isoStr)return '';var d=new Date(isoStr);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function key(slug,wk){return slug+'|'+wk;}
function lines(t){return String(t||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);}
function parseVocab(t){
  return lines(t).map(function(l){
    var p;
    if(l.indexOf('\t')>=0)p=l.split('\t');
    else if(/[=＝|｜]/.test(l))p=l.split(/\s*[=＝|｜]\s*/);
    else{var m=l.match(/^(.*?[A-Za-z0-9.)'’\-])\s*([　-鿿＀-￯（(].*)$/);p=m?[m[1],m[2]]:[l,''];}
    return [String(p[0]||'').trim(),String(p.slice(1).join(' ')||'').trim()];
  }).filter(function(p){return p[0];});
}
function vocabText(v){return (v||[]).map(function(p){return p[1]?p[0]+' = '+p[1]:p[0];}).join('\n');}
function thisWeek(){return iso(mondayOf(new Date()));}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function hasRoster(slug){var r=S.roster[slug];return !!(r&&r.length);}
function slotsOf(slug){return hasRoster(slug)?S.roster[slug]:[{id:'main',subject:'',teacher:'',days:''}];}
function slotById(slug,id){var a=slotsOf(slug);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function dayBi(d){var M={'一':'Mon','二':'Tue','三':'Wed','四':'Thu','五':'Fri','六':'Sat','日':'Sun'};var e=String(d||'').split(/[、,，\s]+/).map(function(x){return M[x]||'';}).filter(Boolean);return d+(e.length?' '+e.join('/'):'');}
function slotLabel(s){return (s.subject||'課程內容 Content')+(s.teacher?' — '+s.teacher:'')+(s.days?'（'+s.days+'）':'');}
function partOf(slug,wk,id){var r=S.reports[key(slug,wk)];return r&&r.parts?r.parts[id]:null;}
function hasAnyPart(slug,wk){var r=S.reports[key(slug,wk)];return !!(r&&r.parts&&Object.keys(r.parts).length);}
function weeksFor(slug){return Object.keys(S.reports).filter(function(k){return k.split('|')[0]===slug&&hasAnyPart(slug,k.split('|')[1]);}).map(function(k){return k.split('|')[1];}).sort().reverse();}

function teacherNames(){

  Object.keys(S.roster).forEach(function(k){(S.roster[k]||[]).forEach(function(s){if(s.teacher)set[s.teacher]=1;});});
  Object.keys(S.reports).forEach(function(k){var ps=S.reports[k].parts||{};Object.keys(ps).forEach(function(i){if(ps[i].teacher)set[ps[i].teacher]=1;});});
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b);});

function byTeacher(wk){

}

function buildDoc(state){

    '<style id="app-style">'+style+'</style></head><body><div id="app"></div><script type="application/json" id="app-state">'+json+E+

function failMsg(e,set){
  var code=e&&e.code;
  if(code==='conflict'){set({kind:'info',text:'剛好有其他人同時送出，頁面正在更新。更新後會帶回你的內容，請再按一次。Someone submitted at the same time — please try again.'});return;}
  ss('pending',null);
  if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(code)>=0)
    set({kind:'err',text:'你的帳號目前沒有發佈權限。請聯絡 Jen 在分享設定中把你設為「可編輯」。內容已存成草稿，不會遺失。No publish permission — ask Jen for edit access. Your draft is saved.'});
  else if(code==='rate_limited')set({kind:'err',text:'送出太頻繁了，請等一分鐘再按一次。內容已存成草稿。Too many submissions — wait a minute and try again. Draft saved.'});
  else if(code==='too_large')set({kind:'err',text:'週報資料已經太大，請聯絡 Jen 封存舊的週次。Data too large — contact Jen.'});
  else set({kind:'err',text:'發佈沒有成功 Publish failed（'+(code||'未知錯誤 Unknown error')+'）。內容已存成草稿，請稍後再按一次。'});
}

  if(!artNs){ui.msg={kind:'err',text:'這個畫面無法發佈。請在 claude.ai 用有「可編輯」權限的帳號開啟這個頁面。Open this page in claude.ai with an editor account to publish.'};render();return;}
  r.updatedAt=new Date().toISOString();
  var next=withPart(clone(S),ui.fcls,ui.fweek,r);
  ss('pending',JSON.stringify({type:'part',key:fkey(),slug:ui.fcls,week:ui.fweek,r:r}));

}

var SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5L6 9H3V15H6L11 19V5Z" fill="currentColor"/><path d="M15.5 8.5C16.5 9.5 17 10.7 17 12C17 13.3 16.5 14.5 15.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
var PR={open:false,title:'',list:[],i:0,rate:0.85,playing:false,stop:false};
var HAS_TTS='speechSynthesis' in window;
function pickVoice(){try{var vs=speechSynthesis.getVoices();return vs.filter(function(v){return /^en(-|_)US/i.test(v.lang);})[0]||vs.filter(function(v){return /^en/i.test(v.lang);})[0]||null;}catch(e){return null;}}
function say(text,done){
  if(!HAS_TTS){if(done)done();return;}
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=PR.rate;var v=pickVoice();if(v)u.voice=v;
    u.onend=function(){if(done)done();};u.onerror=function(){if(done)done();};speechSynthesis.speak(u);}catch(e){if(done)done();}
}
function openPractice(item){if(!item||!item.list.length)return;PR.open=true;PR.title=item.title;PR.list=item.list;PR.i=0;PR.playing=false;renderPractice();say(PR.list[0][0]);}
function closePractice(){PR.open=false;PR.playing=false;PR.stop=true;try{speechSynthesis.cancel();}catch(e){}renderPractice();}
function playAll(){
  if(PR.playing){PR.stop=true;PR.playing=false;try{speechSynthesis.cancel();}catch(e){}renderPractice();return;}
  PR.playing=true;PR.stop=false;PR.i=0;renderPractice();
  (function step(){if(PR.stop||!PR.open){PR.playing=false;renderPractice();return;}
    say(PR.list[PR.i][0],function(){if(PR.stop||!PR.open)return;if(PR.i<PR.list.length-1){setTimeout(function(){if(PR.stop)return;PR.i++;renderPractice();step();},500);}else{PR.playing=false;renderPractice();}});})();
}
function renderPractice(){
  var root=document.getElementById('practice-root');
  if(!root){root=document.createElement('div');root.id='practice-root';document.body.appendChild(root);}
  if(!PR.open){root.innerHTML='';document.body.style.overflow='';return;}

      '<button type="button" class="pr-round" id="pr-next" aria-label="下一個">›</button></div>'+
    '<div class="pr-rate"><span>慢 Slow</span><input type="range" id="pr-rate" min="0.6" max="1.1" step="0.05" value="'+PR.rate+'" aria-label="語速"><span>快 Fast</span></div>'+
    '<div class="pr-actions"><button type="button" class="btn'+(PR.playing?' primary':'')+'" id="pr-all">'+(PR.playing?'停止 Stop':'全部念一次 Play all')+'</button></div>'+

    '<p class="hint">發音使用裝置內建語音，不同手機或電腦聲音會不太一樣。Voices vary by device.</p></div></div>';
